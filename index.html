        card.append(compare(pic, v.rows[0].name, you));
      }
      const lp = (doc.loops || []).find(l => l.view === v.view && !l.finding && l.frames && l.frames.length);
      if (lp) card.append(duet(lp, v.rows[0].name) || loopPlayer(lp));
      s.append(card);
    }
    main.append(s);
  }

  // Findings.
  if (n.findings.items.length) {
    const s = section(++secNo, n.findings.title, "findings", n.findings.intro);
    const card = el("div", "card fd");
    const groups = [["root"], ["downstream"], ["later"]];
    groups.forEach((roles, gi) => {
      const items = n.findings.items.filter(f => roles.includes(f.role));
      if (!items.length) return;
      if (gi > 0 && card.children.length) card.append(el("div", "arrow", "↓"));
      for (const f of items) {
        const it = el("div", "fd-i " + f.role);
        it.id = "fd-" + f.id;
        const t = el("div"); t.append(el("b", null, f.title));
        if (f.sub) t.append(el("small", null, f.sub));
        if (f.detail) t.append(el("p", null, f.detail));
        it.append(el("span", "no", f.no), t);
        if (f.highlight) it.append(explain(doc, byId[f.highlight.check], f.highlight, f.id));
        card.append(it);
      }
    });
    if (n.findings.summary) card.append(el("p", "note", n.findings.summary));
    s.append(card);
    main.append(s);
  }

  // Locked checks: the reason once for the group, and how to film so they can be judged. Each camera's picture is
  // shown once on the page; a later lock for the same camera links back to it.
  const guideShown = {};
  // The pictures show a right-hander; a left-hander's are the same turned left for right. The doc says which hand the
  // swings showed, and the button on a picture turns every picture on the page.
  let lefty = doc.handed === "left";
  const turnGuides = () => {
    for (const i of document.querySelectorAll(".guide img")) i.classList.toggle("mirror", lefty);
    for (const b of document.querySelectorAll(".guide .hand")) b.textContent = lefty ? "右手打 ⇄" : "左手打 ⇄";
  };
  const lockBox = lk => {
    const box = el("div", "lock");
    const hd = el("div", "hd");
    const icon = svg("svg", { viewBox: "0 0 16 16", "aria-hidden": "true" });
    icon.append(svg("path", { d: "M4.5 7V5a3.5 3.5 0 0 1 7 0v2h.5A1 1 0 0 1 13 8v6a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1h.5Zm1.5 0h4V5a2 2 0 0 0-4 0v2Z" }));
    hd.append(icon, el("span", null, lk.badge), el("small", null, `${lk.count} 项`));
    box.append(hd, el("p", null, lk.line));
    const gd = lk.guide;
    if (gd) {
      const id = "guide-" + gd.view;
      if (guideShown[gd.view]) {
        const a = el("a", null, `${gd.title}：见上方 ›`);
        a.href = "#" + id;
        box.append(a);
      } else {
        guideShown[gd.view] = true;
        const f = el("div", "guide");
        f.id = id;
        const img = el("img");
        img.loading = "lazy";
        img.alt = gd.title;
        img.src = gd.image;
        img.classList.toggle("mirror", lefty);
        const hand = el("button", "hand", lefty ? "右手打 ⇄" : "左手打 ⇄");
        hand.type = "button";
        hand.onclick = () => { lefty = !lefty; turnGuides(); };
        const pic = el("div", "pic");
        pic.append(img, hand);
        img.onerror = () => pic.remove();
        const ul = el("ul");
        for (const p of gd.points) ul.append(el("li", null, p));
        f.append(pic, el("b", null, gd.title), ul);
        if (gd.note) f.append(el("span", "note", gd.note));
        box.append(f);
      }
    }
    return box;
  };

  // Checks.
  const cs = section(++secNo, n.checks.title, "checks", n.checks.intro);
  const leg = el("div", "card legend");
  for (const l of n.checks.legend) leg.append(el("span", null, l));
  cs.append(leg);
  for (const g of n.checks.groups) {
    const card = el("div", "card");
    card.id = "g-" + g.id;
    const hd = el("div", "grp-hd");
    hd.append(el("h3", null, g.title), el("small", null, g.sub));
    card.append(hd);
    const chips = el("div", "chips");
    if (g.counts.problem) chips.append(el("span", "chip p", `${g.counts.problem} 问题`));
    if (g.counts.watch) chips.append(el("span", "chip w", `${g.counts.watch} 注意`));
    if (g.counts.ok) chips.append(el("span", "chip o", `${g.counts.ok} 合格`));
    if (g.counts.excluded) chips.append(el("span", "chip", `${g.counts.excluded} 不评`));
    card.append(chips);
    const hl = g.highlight;
    if (hl) {
      const c = byId[hl.check];
      const shown = explained[hl.check];
      if (shown) {
        const a = el("a", "see", `讲解图在「问题从哪里来」第 ${shown.no} 条：${shown.title}`);
        a.href = "#fd-" + shown.id;
        card.append(a);
      } else {
        const pros = media(doc, { who: "pro", check: hl.check });
        const yous = media(doc, { who: "you", check: hl.check, pick: "typical" });
        const phases = [...new Set(yous.map(m => m.phase))].filter(p => pros.some(m => m.phase === p));
        if (phases.length) {
          const pair = el("div");
          const names = { address: "站位", top: "顶点", impact: "击球", finish: "收杆" };
          const show = ph => {
            pair.textContent = "";
            pair.append(compare(pros.find(m => m.phase === ph), hl.pro_name || "职业", yous.find(m => m.phase === ph)));
          };
          if (phases.length > 1) {
            const bt = el("div", "phases");
            phases.forEach((ph, i) => {
              const b = el("button", i === phases.length - 1 ? "on" : "", names[ph] || ph);
              b.onclick = () => { [...bt.children].forEach(x => x.classList.remove("on")); b.classList.add("on"); show(ph) };
              bt.append(b);
            });
            card.append(bt);
          }
          show(phases[phases.length - 1]);
          card.append(pair);
        }
        card.append(stripBox(doc, c, hl));
      }
      if (hl.tool) {
        const a = el("a", "tool-hint");
        a.href = "#tool-" + hl.tool;
        const t = el("span"); t.append(el("small", null, `工具 ${hl.tool_no}`), el("b", null, hl.tool_title || ""));
        a.append(t);
        card.append(a);
      }
    }
    for (const lk of g.locked || []) card.append(lockBox(lk));
    const rows = el("div", "rows");
    for (const r of g.rows) {
      const row = el("div", "row " + r.status);
      const mark = { problem: "!", watch: "!", ok: "✓", excluded: "–" }[r.status];
      row.append(el("span", "m", mark), el("span", "ti", r.title), el("span", "bd", r.badge));
      if (r.line) row.append(el("span", "ln", r.line));
      rows.append(row);
    }
    card.append(rows);
    cs.append(card);
  }
  main.append(cs);

  // Finish and grip photos.
  const finishes = media(doc, { who: "you", pick: "finish" }), grips = media(doc, { who: "you", pick: "grip" });
  if (n.photos && (finishes.length || grips.length)) {
    const s = section(++secNo, n.photos.title, "photos", n.photos.intro);
    const viewName = v => v === "face_on" ? "正面" : "侧面";
    for (const [list, note, what] of [[finishes, n.photos.finish_note, "收杆"], [grips, n.photos.grip_note, "握杆"]]) {
      if (!list.length) continue;
      const card = el("div", "card");
      card.append(el("h3", null, what));
      const g = el("div", "photo-grid");
      for (const m of list) g.append(figure(m, `${viewName(m.view)} · 第 ${m.swing + 1} 杆`));
      card.append(g, el("p", "mute", note));
      s.append(card);
    }
    main.append(s);
  }

  // Plan.
  if (n.plan) {
    const s = section(++secNo, n.plan.title, "plan", n.plan.intro);
    for (const t of n.plan.tools) {
      const card = el("div", "card tool");
      card.id = "tool-" + t.id;
      card.append(el("span", "tag", `工具 ${t.no}`), el("h3", null, t.title), el("p", null, t.lead));
      const pics = toolPictures(doc, t.id);
      if (pics) card.append(pics);
      const ol = el("ol");
      for (const step of t.steps) ol.append(el("li", null, step));
      card.append(ol);
      if (t.id === "metronome" && t.bpm) {
        const m = el("div", "metro");
        const beats = el("div", "beats");
        for (let i = 0; i < 5; i++) beats.append(el("i", i === 4 ? "hit" : ""));
        const btns = el("div", "btns");
        t.bpm.forEach((b, i) => {
          const btn = el("button", i ? "alt" : "", `听 ${b} 拍`);
          btn.onclick = () => metronome(b, beats);
          btns.append(btn);
        });
        m.append(btns, beats, el("span", "mute", "前三声上杆，第四声到顶点，最后一声击球。"));
        card.append(m);
      }
      s.append(card);
    }
    const ss = el("div", "card");
    ss.append(el("h3", null, n.plan.sessions_title), el("p", "mute", n.plan.sessions_intro));
    const list = el("div", "ss");
    for (const x of n.plan.sessions) {
      const it = el("div", "s-i" + (x.n === n.plan.sessions.length ? " rt" : ""));
      const wk = el("span", "wk"); wk.append(el("b", null, `第 ${x.n} 次`), document.createTextNode(`第 ${x.week} 周`));
      it.append(wk, el("span", "what", x.what), el("span", "tl", x.tools));
      if (x.pass) it.append(el("span", "ps", x.pass));
      list.append(it);
    }
    ss.append(list);
    s.append(ss);
    main.append(s);
  }

  // Retest.
  if (n.retest) {
    const s = section(++secNo, n.retest.title, "retest", n.retest.intro);
    const card = el("div", "card");
    for (const r of n.retest.items) {
      const t = doc.retest.find(x => x.check === r.check);
      const it = el("div", "rt-i");
      it.append(el("b", null, r.title));
      const lb = el("div", "lb");
      lb.append(el("span", "now", r.now), el("span", "tg", r.target), el("span", "pr", r.pro));
      it.append(lb);
      const target = t.target_max != null ? t.target_max : t.target_min;
      const pro = t.pro_p50 != null ? t.pro_p50 : t.pro_edge;
      const [lo, hi] = axis([t.now, target, pro]);
      const X = x => 8 + (x - lo) / (hi - lo) * 324;
      const b = svg("svg", { viewBox: "0 0 340 28" });
      b.append(svg("line", { x1: 8, x2: 332, y1: 14, y2: 14, stroke: "#24302A", "stroke-width": 2 }));
      b.append(svg("line", { x1: X(t.now), x2: X(target), y1: 14, y2: 14, stroke: C.accent, "stroke-width": 2, "stroke-dasharray": "3 3" }));
      [[pro, C.ref], [target, C.accent], [t.now, C.fault]].forEach(([x, col]) => b.append(svg("circle", { cx: X(x), cy: 14, r: 6, fill: col })));
      it.append(b);
      card.append(it);
    }
    s.append(card);
    main.append(s);
  }

  // What is not certain.
  const clubLow = (doc.loops || []).filter(l => l.club_seen != null && l.club_seen < 0.7 && l.frames && l.frames.length);
  if (n.uncertain || clubLow.length) {
    const u = n.uncertain || { title: "不确定的地方", intro: "", items: [] };
    const s = section(++secNo, u.title, "uncertain", u.intro);
    const card = el("div", "card unsure");
    const items = [...u.items];
    for (const l of clubLow) items.push({ title: "杆头轨迹", text: `${l.view === "face_on" ? "正面" : "侧面"}慢放里杆头只认出了 ${Math.round(l.club_seen * 100)}% 的画面，黄线只作参考，不计分。` });
    for (const it of items) {
      const row = el("div", "u-i");
      row.append(el("b", null, it.title), el("p", null, it.text));
      card.append(row);
    }
    s.append(card);
    main.append(s);
  }

  // The outline lists only the sections the page has, numbered as they come.
  [...document.querySelectorAll(".ol a")].forEach(a => { if (!document.getElementById(a.getAttribute("href").slice(1))) a.remove() });
  [...document.querySelectorAll(".ol a > b")].forEach((b, i) => { b.textContent = String(i + 1) });

  main.append(el("footer", null, n.footer));
}

// The coach's order: the old page is built first, then its parts are moved into a coach's order, with the
// details folded. Nothing is rewritten: every sentence and picture comes from the old page or the doc.
const ico = (name, cls) => {
  const i = el("img", "ico" + (cls ? " " + cls : ""));
  i.src = `icons/${name}.png`; i.alt = ""; i.onerror = () => i.remove();
  return i;
};
const foldIcon = { "数字怎么来的": "film", "这次没评的项目和原因": "folder", "全部检查明细（按机位）": "checklist", "握杆照片": "glove", "关于这份报告": "pad" };
function fold(label, ...kids) {
  const d = el("details", "fold");
  const s = el("summary");
  if (foldIcon[label]) s.append(ico(foldIcon[label]));
  s.append(el("span", null, label));
  d.append(s);
  const body = el("div", "fold-in");
  body.append(...kids.filter(Boolean));
  d.append(body);
  return d;
}

// 你的挥杆现状: the swing in six phases, each read from both cameras at once (a camera not filmed leaves the other),
// then one list of the phase's checks, each tagged with its camera. Every swing the report read sits behind a button:
// a list per camera, and each swing's clip with its numbers.
const VIEW = { face_on: "正面", down_the_line: "侧面" };
const VIEW_ICO = { face_on: "view-faceon", down_the_line: "view-dtl" };
const ST = { problem: ["要改", "st-fix"], watch: ["注意", "st-watch"], ok: ["合格", "st-ok"], excluded: ["没评", "st-off"] };
const isImpactCheck = c => /impact/.test(c.id);
const PHASES = [
  { id: "setup", label: "站位", when: "准备击球时", at: "address", icon: "ph-setup", has: c => c.category === "setup" },
  { id: "backswing", label: "上杆", when: "从起杆到顶点", at: "top", icon: "ph-backswing", has: c => c.category === "backswing", top: true },
  { id: "down", label: "下杆", when: "顶点到击球前", at: "half_down", pic: false, icon: "ph-downswing", has: c => c.category === "downswing" && !isImpactCheck(c) },
  { id: "impact", label: "击球", when: "杆头碰球那一刻", at: "impact", score: "downswing", icon: "ph-impact", has: c => c.category === "downswing" && isImpactCheck(c) },
  { id: "finish", label: "收杆", when: "送杆到结束", at: "finish", icon: "ph-finish", has: c => c.category === "finish" },
  { id: "tempo", label: "节奏", when: "上杆和下杆用的时间", at: "top", pic: false, icon: "ph-tempo", has: c => c.category === "tempo", oneView: true },
];
const JUMPS = [["address", "站位", "ph-setup"], ["top", "顶点", "ph-backswing"], ["half_down", "下杆", "ph-downswing"], ["impact", "击球", "ph-impact"], ["finish", "收杆", "ph-finish"]];
const scoreBand = s => s == null ? "na" : s >= 80 ? "good" : s >= 50 ? "mid" : "bad";

function vtag(view) {
  const t = el("span", "vt");
  t.append(ico(VIEW_ICO[view], "xs"), document.createTextNode(VIEW[view]));
  return t;
}

function stChip(status) {
  const [word, name] = ST[status] || ["", null];
  const c = el("span", "chip " + status);
  if (name) c.append(ico(name, "xs"));
  c.append(document.createTextNode(word));
  return c;
}

// A check's values over every video, each with its swing.
function checkValues(c) {
  return (c.views || []).flatMap(v => (v.values || []).map((x, i) => ({ x, video: v.video, swing: v.swing_ids ? v.swing_ids[i] : null, pro: v.pro })));
}

function outsideBand(c, x, pro) {
  if (!pro || pro.p10 == null || pro.p90 == null) return false;
  const hi = x > pro.p90, lo = x < pro.p10;
  return c.problem_side === "hi" ? hi : c.problem_side === "lo" ? lo : hi || lo;
}

function nowSection(doc, p3) {
  const n = doc.narrative;
  const rowOf = Object.fromEntries(n.checks.groups.flatMap(g => g.rows).map(r => [r.check, r]));
  const sc = Object.fromEntries(doc.scores.categories.map(c => [c.id, c.score]));
  const filmed = new Set(doc.videos.map(v => v.view));
  const lookName = v => { const l = (doc.lookalikes || []).find(x => x.view === v); const r = l && l.rows[0]; return r && (r.name_zh || r.player) };
  const sheet = swingSheet(doc, rowOf);
  const title = c => ((rowOf[c.id] || {}).title || c.label).replace(/^(站位|顶点|击球|收杆|上杆)/, "");
  function spread(c) {
    const vals = checkValues(c), pro = c.views && c.views[0] && c.views[0].pro;
    if (!vals.length || !pro || pro.p10 == null) return null;
    const [lo, hi] = axis([...vals.map(v => v.x), pro.p10, pro.p90]);
    const X = x => 6 + (x - lo) / (hi - lo) * 288;
    const s = svg("svg", { viewBox: "0 0 300 26", class: "spread" });
    s.append(svg("rect", { x: X(pro.p10), y: 8, width: Math.max(2, X(pro.p90) - X(pro.p10)), height: 10, rx: 5, fill: "#1F3A24" }));
    if (pro.p50 != null) s.append(svg("line", { x1: X(pro.p50), x2: X(pro.p50), y1: 4, y2: 22, stroke: "#9BE15D", "stroke-width": 1.5 }));
    for (const v of vals) {
      const out = outsideBand(c, v.x, v.pro);
      const dot = svg("circle", { cx: X(v.x), cy: 13, r: 4.2, fill: out ? (c.status === "problem" ? "#F07A5E" : "#E8B04A") : "#0B1310", stroke: out ? "none" : "#9BE15D", "stroke-width": 1.4 });
      // Tap a dot: that swing's clip.
      if (v.swing != null && sheet.has(v.video, v.swing)) { dot.setAttribute("class", "hit"); dot.addEventListener("click", () => sheet.open(c.phase, c.view, v.video, v.swing)) }
      s.append(dot);
    }
    return s;
  }
  function row(c) {
    const r = rowOf[c.id] || {};
    const box = el("div", "r2");
    const top = el("div", "r2-top");
    if (c.category !== "tempo") top.append(vtag(c.view));
    top.append(el("b", null, title(c)), stChip(c.status));
    box.append(top);
    const vs = c.views || [], nn = vs.reduce((a, v) => a + v.n, 0), out = vs.reduce((a, v) => a + v.outside, 0);
    if (nn && c.status !== "excluded") box.append(el("div", "r2-tally", out ? `${nn} 杆里 ${out} 杆在职业区间外` : `${nn} 杆都在职业区间里`));
    const sp = c.status !== "excluded" && spread(c);
    if (sp) box.append(sp);
    if (r.line) box.append(el("div", "r2-num", r.line.replace(/^中位数 /, "你 ")));
    return box;
  }
  const ord = { problem: 0, watch: 1, ok: 2, excluded: 3 };
  // The swing arc: six phases in swing order, each filled to its score; tap one to go to it.
  {
    const toneHex = { good: "#9BE15D", mid: "#E8B04A", bad: "#F07A5E" };
    const W = 360, H = 176, cx = 180, cy = 214, AR = 168;
    const g = svg("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "挥杆各段得分" });
    const pt = (d, r) => [cx + r * Math.cos(d * Math.PI / 180), cy - r * Math.sin(d * Math.PI / 180)];
    const arc = (d1, d2, r) => { const [x1, y1] = pt(d1, r), [x2, y2] = pt(d2, r); return `M${x1.toFixed(1)} ${y1.toFixed(1)}A${r} ${r} 0 0 1 ${x2.toFixed(1)} ${y2.toFixed(1)}` };
    const from = 162, to = 18, gap = 3, span = (from - to - gap * (PHASES.length - 1)) / PHASES.length;
    PHASES.forEach((p, i) => {
      const s = sc[p.score || p.id] ?? null;
      const d1 = from - i * (span + gap), d2 = d1 - span, mid = (d1 + d2) / 2;
      const a = svg("a", { href: "#ph-" + p.id });
      a.append(svg("path", { d: arc(d1, d2, AR), fill: "none", stroke: "#26332C", "stroke-width": 2, "stroke-linecap": "round", "stroke-dasharray": s == null ? "1 5" : "none" }));
      if (s) a.append(svg("path", { d: arc(d1, d1 - span * s / 100, AR), fill: "none", stroke: toneHex[scoreBand(s)], "stroke-width": 7, "stroke-linecap": "round" }));
      const [lx, ly] = pt(mid, AR + 20), [nx, ny] = pt(mid, AR - 34);
      const nm = svg("text", { x: lx.toFixed(1), y: (ly + 4).toFixed(1), "text-anchor": "middle", class: "gn" });
      nm.textContent = p.label;
      const nu = svg("text", { x: nx.toFixed(1), y: (ny + 8).toFixed(1), "text-anchor": "middle", class: "gv " + scoreBand(s) });
      nu.textContent = s == null ? "—" : String(s);
      a.append(nm, nu);
      g.append(a);
    });
    const glance = el("div", "glance");
    glance.append(g);
    p3.append(glance);
  }
  for (const p of PHASES) {
    const cs = doc.checks.filter(p.has).map(c => Object.assign(c, { phase: p.id })).sort((a, b) => ord[a.status] - ord[b.status]);
    const s = sc[p.score || p.id] ?? null;
    const card = el("div", "ph2");
    card.id = "ph-" + p.id;
    const hd = el("div", "ph2-hd");
    const t = el("div");
    t.append(el("h3", null, p.label), el("div", "when", p.when));
    hd.append(ico(p.icon), t, el("span", "sc " + scoreBand(s), s == null ? "—" : String(s)));
    card.append(hd);
    const bad = cs.filter(c => c.status === "problem" || c.status === "watch");
    const name = c => (rowOf[c.id] || {}).title || c.label;
    // Measured but set aside is not the same as never measured: say which, and point at the reason.
    card.append(el("p", "ph2-say", bad.length ? "先看：" + bad.slice(0, 2).map(name).join("、")
      : cs.some(c => c.status === "ok") ? "这一段都在职业区间里。"
      : cs.length ? `这一段量了${cs.map(name).join("、")}，但这次不计分，原因在下面「这次没评」里。`
      : "这一段还没有能测准的检查。"));
    if (p.oneView) {
      card.append(el("p", "todo", "节奏只看时间，哪个角度拍的都能测。"));
    } else {
      const cams = el("div", "cams");
      for (const v of ["face_on", "down_the_line"]) {
        const c = el("span", filmed.has(v) ? null : "off");
        c.append(ico(VIEW_ICO[v], "xs"), document.createTextNode(VIEW[v] + (filmed.has(v) ? "" : " 没拍")));
        cams.append(c);
      }
      card.append(cams);
    }
    // Both cameras at once: one column per camera, her frame above her look-alike's. One camera only: hers and the
    // pro's side by side.
    const views = ["face_on", "down_the_line"].filter(v => filmed.has(v));
    const tops = (n.top && n.top.pairs) || [];
    const pics = p.oneView || p.pic === false ? [] : views.map(v => {
      const tp = p.top && tops.find(x => x.view === v);
      const you = tp ? media(doc, { id: "you-topclub-" + v })[0]
        : media(doc, { who: "you", view: v, phase: p.at, pick: "typical" })[0] || media(doc, { who: "you", view: v, phase: p.at })[0];
      const pro = tp ? media(doc, { id: "pro-topclub-" + v })[0] : media(doc, { who: "pro", view: v, phase: p.at })[0];
      return { v, you, pro, name: (tp && tp.pro_name) || lookName(v) || "职业", tp };
    }).filter(x => x.you);
    if (pics.length) {
      const grid = el("div", "pair2");
      const one = pics.length === 1;
      grid.style.setProperty("--c", one ? 2 : pics.length);
      const head = v => { const h = el("div", "pc-h"); h.append(ico(VIEW_ICO[v], "sm"), document.createTextNode(VIEW[v])); return h };
      if (one) { const h = head(pics[0].v); h.style.gridColumn = "1 / -1"; grid.append(h) } else for (const x of pics) grid.append(head(x.v));
      const cell = (m, cap, cls) => { const f = m ? figure(m, cap) : el("div", "pc-none", "没有这位职业这一刻的画面"); f.classList.add(cls); return f };
      // A row of empty pro cells says nothing; keep a placeholder only beside a pro picture in the other column.
      const anyPro = pics.some(x => x.pro);
      if (one) grid.append(cell(pics[0].you, "你", "you"), ...(anyPro ? [cell(pics[0].pro, pics[0].name, "pro")] : []));
      else { for (const x of pics) grid.append(cell(x.you, "你", "you")); if (anyPro) for (const x of pics) grid.append(cell(x.pro, x.name, "pro")) }
      card.append(grid);
    }
    const hand = p.top ? tops.filter(x => x.lines && x.lines.length) : [];
    if (hand.length) {
      const hc = el("div", "hc");
      const h5 = el("h5");
      h5.append(ico("hands-club", "sm"), document.createTextNode((n.top && n.top.title) || "手和杆"));
      hc.append(h5);
      for (const x of hand) for (const l of [...x.lines, ...(x.club ? [x.club] : [])]) { const q = el("p"); q.append(vtag(x.view), document.createTextNode(l)); hc.append(q) }
      if (n.top && n.top.note) hc.append(el("p", "mute small", n.top.note));
      card.append(hc);
    }
    const shown = cs.filter(c => c.status === "problem" || c.status === "watch");
    if (shown.length) { const list = el("div"); list.append(...shown.map(row)); card.append(list) }
    if (sheet.count(p) && !(p.oneView && !cs.length)) {
      const b = el("button", "every");
      b.append(ico("every-swing"), document.createTextNode("看每一杆"), el("small", null, sheet.count(p)));
      b.onclick = () => sheet.open(p.id);
      card.append(b);
    }
    const ok = cs.filter(c => c.status === "ok"), ex = cs.filter(c => c.status === "excluded");
    if (ok.length) { const b = el("div"); b.append(...ok.map(row)); card.append(fold(`合格 ${ok.length} 项`, b)) }
    if (ex.length) { const b = el("div"); b.append(...ex.map(row)); card.append(fold(`这次没评 ${ex.length} 项`, b)) }
    p3.append(card);
  }
}

// The every-swing sheet: one phase's swings per camera, each with its numbers; tap one to play it slowly.
function swingSheet(doc, rowOf) {
  const list = doc.swings || [];
  const byView = { face_on: list.filter(s => s.view === "face_on"), down_the_line: list.filter(s => s.view === "down_the_line") };
  const has = (video, swing) => list.some(s => s.video === video && s.swing === swing);
  const name = c => ((rowOf[c.id] || {}).title || c.label).replace(/^(站位|顶点|击球|收杆|上杆)/, "");
  const fmt = (c, x) => c.id === "top_shaft_level" ? (x >= 0 ? "未到水平 " : "过水平 ") + Math.abs(x).toFixed(1) + "°"
    : c.id === "top_shaft_target" ? (x ? "指向目标" : "背离目标") : c.unit === "deg" ? x.toFixed(1) + "°" : c.unit === "s" ? x.toFixed(2) + " 秒"
    : /share/.test(c.unit) ? Math.round(x * 100) + "%" : x.toFixed(2);
  function value(c, s) {
    const v = (c.views || []).find(v => v.video === s.video);
    const i = v && v.swing_ids ? v.swing_ids.indexOf(s.swing) : -1;
    if (i < 0) return null;
    return { x: v.values[i], out: outsideBand(c, v.values[i], v.pro), pro: v.pro };
  }
  const ph = id => PHASES.find(p => p.id === id);
  const checksOf = (p, view) => doc.checks.filter(c => p.has(c) && (p.oneView || c.view === view) && c.status !== "excluded" && (c.views || []).length);
  const sheet = el("div", "sheet");
  sheet.setAttribute("role", "dialog");
  document.body.append(sheet);
  let state = { phase: "backswing", view: "face_on", only: false };
  const close = () => { sheet.classList.remove("on"); document.documentElement.style.overflow = ""; sheet.querySelectorAll("video").forEach(v => v.pause()) };
  function bar(title, back) {
    const b = el("div", "sh-bar");
    if (back) { const k = el("button", "back", "‹ 每一杆"); k.onclick = back; b.append(k) }
    b.append(el("h4", null, title));
    const x = el("button", "x", "×");
    x.setAttribute("aria-label", "关闭");
    x.onclick = close;
    b.append(x);
    return b;
  }
  const stillOf = (s, at) => s.stills[at] || s.stills.top || Object.values(s.stills)[0];
  function showList() {
    const p = ph(state.phase);
    const views = ["face_on", "down_the_line"].filter(v => byView[v].length);
    if (!views.includes(state.view)) state.view = views[0];
    sheet.replaceChildren(bar(`${p.label} · 每一杆`));
    const tabs = el("div", "tabs");
    for (const v of views) {
      const b = el("button", v === state.view ? "on" : null);
      b.append(ico(VIEW_ICO[v], "sm"), document.createTextNode(`${VIEW[v]} ${byView[v].length} 杆`));
      b.onclick = () => { state.view = v; showList() };
      tabs.append(b);
    }
    sheet.append(tabs);
    const cs = checksOf(p, state.view);
    const only = el("label", "only");
    const cb = el("input");
    cb.type = "checkbox"; cb.checked = state.only;
    cb.onchange = () => { state.only = cb.checked; showList() };
    only.append(cb, ico("filter", "sm"), document.createTextNode(`只看有超出职业区间的杆 · 这一段${p.oneView ? "" : VIEW[state.view]}有 ${cs.length} 项检查`));
    sheet.append(only);
    for (const s of byView[state.view]) {
      const vals = cs.map(c => ({ c, r: value(c, s) })).filter(x => x.r);
      const bad = vals.filter(x => x.r.out).length;
      if (state.only && !bad) continue;
      const row = el("div", "sw");
      const f = stillOf(s, p.at);
      if (f) { const img = el("img"); img.loading = "lazy"; img.alt = ""; img.src = f; row.append(img) } else row.append(el("div", "noimg"));
      const b = el("div", "sw-b"), t = el("div", "sw-t");
      t.append(el("b", null, `第 ${s.no} 杆`), el("span", null, `视频 ${s.video_no}`));
      if (vals.length) {
        const tag = el("i", bad ? "bad" : "good");
        tag.append(ico(bad ? "band-out" : "band-in", "xs"), document.createTextNode(bad ? `${bad} 项超出` : "都在区间里"));
        t.append(tag);
      }
      const vs = el("div", "vals");
      for (const { c, r } of vals) vs.append(el("span", r.out ? "out" : null, `${name(c)} ${fmt(c, r.x)}`));
      if (!vals.length) vs.append(el("span", null, "这一杆这一段没有能测准的数"));
      b.append(t, vs);
      row.append(b);
      row.onclick = () => play(s);
      sheet.append(row);
    }
  }
  function play(s) {
    const p = ph(state.phase), all = byView[s.view], k = all.indexOf(s);
    sheet.replaceChildren(bar(`${VIEW[s.view]} 第 ${s.no} 杆`, showList));
    sheet.scrollTop = 0;
    const box = el("div", "player");
    const at = x => s.at[x] != null && s.clip_start != null ? s.at[x] - s.clip_start : null;
    let v = null;
    if (s.clip) {
      v = el("video");
      v.src = s.clip; v.muted = true; v.loop = true; v.playsInline = true;
      v.setAttribute("playsinline", ""); v.setAttribute("webkit-playsinline", "");
      const poster = stillOf(s, p.at);
      if (poster) v.poster = poster;
      v.addEventListener("loadedmetadata", () => { v.playbackRate = 0.25; v.play().catch(() => {}) });
      box.append(v);
    } else {
      const img = el("img", "still");
      img.src = stillOf(s, p.at) || "";
      box.append(img);
      box.append(el("p", "todo", "这一杆的视频没有保留，只能看定格。"));
    }
    const jump = el("div", "ctl");
    for (const [pos, label, icon] of JUMPS) {
      if (s.at[pos] == null || (!v && !s.stills[pos])) continue;
      const b = el("button", pos === p.at ? "on" : null);
      b.append(ico(icon), document.createTextNode(label));
      b.onclick = () => {
        if (v) { v.pause(); v.currentTime = at(pos) } else box.querySelector("img.still").src = s.stills[pos];
        jump.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
      };
      jump.append(b);
    }
    box.append(jump);
    if (v) {
      const sp = el("div", "ctl speed");
      for (const [r, label, icon] of [[0.25, "慢放 1/4", "slow"], [0.5, "1/2", "slow"], [1, "原速", "play"]]) {
        const b = el("button", r === 0.25 ? "on" : null);
        b.append(ico(icon, "sm"), document.createTextNode(label));
        b.onclick = () => {
          v.playbackRate = r; v.play().catch(() => {});
          jump.querySelectorAll("button").forEach(x => x.classList.remove("on"));
          sp.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
        };
        sp.append(b);
      }
      box.append(sp);
    }
    const nav = el("div", "nav2");
    const prev = el("button", null, k > 0 ? "‹ 上一杆" : ""), next = el("button", null, k < all.length - 1 ? "下一杆 ›" : "");
    prev.onclick = () => { if (k > 0) play(all[k - 1]) };
    next.onclick = () => { if (k < all.length - 1) play(all[k + 1]) };
    nav.append(prev, next);
    box.append(nav);
    // This swing's numbers in every phase, the tapped phase first.
    const pg = el("div", "pg");
    for (const q of [p, ...PHASES.filter(x => x !== p)]) {
      const rows = checksOf(q, s.view).map(c => ({ c, r: value(c, s) })).filter(x => x.r);
      if (!rows.length) continue;
      pg.append(el("h5", null, q.label));
      for (const { c, r } of rows) {
        const line = el("div", "pv"), l = el("span", null, name(c));
        if (r.pro && r.pro.p10 != null) l.append(el("em", null, `职业 ${fmt(c, r.pro.p10)} 到 ${fmt(c, r.pro.p90)}`));
        line.append(l, el("b", r.out ? "out" : "ok", fmt(c, r.x)));
        pg.append(line);
      }
    }
    box.append(pg);
    sheet.append(box);
  }
  function open(phase, view, video, swing) {
    state.phase = phase;
    if (view) state.view = view;
    sheet.classList.add("on");
    document.documentElement.style.overflow = "hidden";
    const s = video != null && list.find(x => x.video === video && x.swing === swing);
    if (s) play(s); else showList();
  }
  function count(p) {
    return ["face_on", "down_the_line"].filter(v => byView[v].length && (p.oneView || checksOf(p, v).length || p.pic !== false))
      .map(v => `${VIEW[v]} ${byView[v].length} 杆`).join(" · ");
  }
  addEventListener("keydown", e => { if (e.key === "Escape") close() });
  return { open, has, count };
}

function secHead(no, title, anchor, lead) {
  const wrap = el("section", "part");
  wrap.id = anchor;
  const hd = el("div", "sec");
  hd.append(ico(anchor), el("h2", null, title));
  wrap.append(hd);
  if (lead) wrap.append(el("p", "lead", lead));
  return wrap;
}

function render(doc) {
  renderOld(doc);
  const n = doc.narrative;
  const main = document.getElementById("main");
  const old = [...main.children];
  const byIdEl = id => document.getElementById(id);
  const take = (sel, root = main) => root.querySelector(sel);
  const hero = byIdEl("top");
  const numsCard = old[1], basisCard = old[2];
  const lookSec = byIdEl("lookalikes"), fdSec = byIdEl("findings"), chkSec = byIdEl("checks");
  const photoSec = byIdEl("photos"), planSec = byIdEl("plan"), retestSec = byIdEl("retest"), unsureSec = byIdEl("uncertain");
  const footer = take("footer");
  main.textContent = "";
  const checkOf = Object.fromEntries(doc.checks.map(c => [c.id, c]));
  const parts = [];

  // 1 结论: a cover. The photo carries the headline; a sheet over its foot carries the line, the score and counts.
  const p1 = el("section", "part cover");
  p1.id = "s-verdict";
  hero.removeAttribute("id");
  const pic = el("div", "cv-pic");
  const heroImg = take(".ph img", hero);
  if (heroImg) pic.append(heroImg);
  const ctop = el("div", "cv-top");
  const brand = el("span", "brand");
  brand.append(document.querySelector(".cn-mark").cloneNode(true), el("b", null, "caddie note"));
  ctop.append(brand);
  const ctitle = el("div", "cv-title");
  const pm = el("div", "pm");
  pm.textContent = "Pro Max";
  take("h1", hero).remove();
  const nameRow = el("div", "cv-name");
  nameRow.append(el("h1", null, "挥杆诊断报告"), el("span", "date", doc.session.label || doc.session.date || ""));
  ctitle.append(pm, nameRow);
  pic.append(ctop, ctitle);
  const sheet = el("div", "cv-sheet");
  const line = take(".line", hero);
  if (line) sheet.append(line);
  const stats = el("div", "cv-stats");
  const ring = el("div", "ring");
  const R = 42, L = 2 * Math.PI * R, ov = doc.scores.overall || 0;
  const rs = svg("svg", { viewBox: "0 0 100 100" });
  rs.append(svg("circle", { cx: 50, cy: 50, r: R, fill: "none", stroke: "#1E2B24", "stroke-width": 6 }),
    svg("circle", { cx: 50, cy: 50, r: R, fill: "none", stroke: C.accent, "stroke-width": 6, "stroke-linecap": "round",
      "stroke-dasharray": `${L * ov / 100} ${L}`, transform: "rotate(-90 50 50)" }));
  const rc = el("div", "c");
  rc.append(el("b", null, String(ov)), el("small", null, "综合"));
  ring.append(rs, rc);
  const cnt = s => doc.checks.filter(c => c.status === s).length;
  const c3 = el("div", "counts3");
  for (const [cls, v, label] of [["p", cnt("problem"), "问题"], ["w", cnt("watch"), "注意"], ["o", doc.checks.filter(c => c.counted && c.status === "ok").length, "合格"]]) {
    const d = el("div", cls); d.append(el("b", null, String(v)), el("span", null, label)); c3.append(d);
  }
  stats.append(ring, c3);
  sheet.append(stats);
  if (n.findings.summary) {
    const order = el("div", "order");
    order.append(el("p", null, n.findings.summary));
    sheet.append(order);
  }
  p1.append(pic, sheet);
  parts.push(p1);

  // 2 这次看了什么
  const p2 = secHead(2, "这次看了什么", "s-basis");
  const unsureItems = unsureSec ? take(".card", unsureSec) : null;
  numsCard.append(
    fold("数字怎么来的", el("p", null, basisCard.querySelector("p").textContent)),
    unsureItems ? fold("这次没评的项目和原因", ...[...unsureItems.children]) : null);
  numsCard.classList.add("flat");
  p2.append(numsCard);
  parts.push(p2);

  // 3 你的挥杆现状: by phase, in swing order, both cameras at once
  const p3 = secHead(3, "你的挥杆现状", "s-now", "一次挥杆分成六段，每段都从正面和侧面各看一遍；哪个角度没拍，那一段就只看拍了的那个。红色要改，橙色注意，绿色合格。");
  nowSection(doc, p3);
  parts.push(p3);

  // 4 问题从哪里来
  const p4 = secHead(4, "问题从哪里来", "s-why", n.findings.intro);
  // The chain: the root problem first, then what it brings with it, each a link to its card below.
  const chain = el("div", "chain");
  const roleWordC = { root: "根源", downstream: "连带", later: "其后" };
  n.findings.items.forEach((f, i) => {
    const a = el("a", "ch-i " + f.role);
    a.href = "#fd-" + f.id;
    const node = el("span", "ch-n", f.no);
    const tx = el("span", "ch-t");
    tx.append(el("b", null, f.title));
    if (f.sub) tx.append(el("em", null, f.sub));
    a.append(node, tx);
    chain.append(a);
  });
  p4.append(chain);
  const lk = lookSec && take(".card.lk", lookSec);
  if (lk) {
    const v = n.lookalikes.views[0];
    const names = v.rows.map(r => r.name).join("、");
    const card = el("div", "card look flat");
    card.append(el("p", null, `按站位的姿势挑出来：${names}。下面每条问题都拿最像你的那位对照。`));
    card.append(fold("看这几位职业和你的对比", lk));
    p4.append(card);
  }
  const fd = take(".card.fd", fdSec);
  const roleWord = { root: "根源", downstream: "连带", later: "其后" };
  for (const it of [...fd.querySelectorAll(".fd-i")]) {
    const role = ["root", "downstream", "later"].find(r => it.classList.contains(r));
    const tdiv = take(":scope > div", it);
    const ex = take(".explain", it);
    const detail = take(":scope > div > p", it);
    if (ex) {
      const cmp = take(".cmp", ex);
      const extra = [...ex.children].filter(x => x !== cmp);
      if (cmp) it.append(cmp);
      it.append(fold("看完整讲解和每一杆", detail, ...extra));
      ex.remove();
    } else if (detail) {
      it.append(fold("看完整讲解", detail));
    }
  }
  p4.append(fd);
  parts.push(p4);

  // 5 怎么改、怎么练
  const p5 = secHead(5, "怎么改、怎么练", "s-fix", n.plan && n.plan.intro);
  // Two weeks, six sessions, as a path: the last one is the retest.
  if (n.plan && n.plan.sessions && n.plan.sessions.length) {
    const path = el("div", "card path");
    const hd = el("div", "pa-hd");
    hd.append(el("b", null, n.plan.sessions_title), el("a", null, "看每次怎么练"));
    hd.lastChild.href = "#sessions";
    path.append(hd);
    const weeks = [...new Set(n.plan.sessions.map(s => s.week))];
    for (const w of weeks) {
      const row = el("div", "pa-row");
      row.append(el("span", "pa-w", `第 ${w} 周`));
      const track = el("div", "pa-track");
      for (const s of n.plan.sessions.filter(x => x.week === w)) {
        const last = s === n.plan.sessions[n.plan.sessions.length - 1];
        const st = el("a", "pa-s" + (last ? " end" : ""));
        st.href = "#sessions";
        st.append(el("span", "pa-n", String(s.n)), el("span", "pa-tl", s.tools));
        track.append(st);
      }
      row.append(track);
      path.append(row);
    }
    p5.append(path);
  }
  const toolCard = id => planSec && planSec.querySelector("#tool-" + id);
  const used = new Set();
  const dress = (t, card) => {
    const img = el("img", "tool-art");
    img.loading = "lazy";
    img.src = `tools/${t.id}.jpg`;
    img.alt = "";
    img.onerror = () => img.remove();
    card.prepend(img);
    const lead = take(":scope > p", card);
    if (lead) lead.classList.add("why");
    const pics = take(".tool-pics", card);
    if (pics) card.append(fold("在你自己的画面上看怎么摆", pics));
    const pass = t.pass;
    if (pass) { const p = el("p", "pass"); p.append(el("b", null, "过关："), document.createTextNode(pass)); card.insertBefore(p, take(".fold", card) || null) }
    return card;
  };
  const orderWord = { root: "先改", downstream: "接着", later: "最后" };
  for (const f of n.findings.items) {
    const block = el("div", "fix");
    const hd = el("div", "fix-hd");
    hd.append(el("h3", null, f.title));
    block.append(hd);
    const change = (f.detail || "").match(/改的时候[^。]*。/);
    if (change) block.append(el("p", "change", change[0]));
    const tools = (n.plan ? n.plan.tools : []).filter(t => t.findings && t.findings.includes(f.id) && !used.has(t.id));
    for (const t of tools) {
      used.add(t.id);
      const card = toolCard(t.id);
      if (card) block.append(dress(t, card));
    }
    p5.append(block);
  }
  const rest = (n.plan ? n.plan.tools : []).filter(t => !used.has(t.id));
  for (const t of rest) {
    const card = toolCard(t.id);
    if (!card) continue;
    const block = el("div", "fix");
    const hd = el("div", "fix-hd");
    hd.append(el("h3", null, "自己核对"));
    block.append(hd, dress(t, card));
    p5.append(block);
  }
  const ss = planSec && [...planSec.querySelectorAll(":scope > .card")].find(c => take(".ss", c));
  if (ss) {
    const card = el("div", "card");
    const sf = fold(n.plan.sessions_title, ...[...ss.children].slice(1));
    sf.id = "sessions";
    card.append(sf);
    p5.append(card);
  }
  parts.push(p5);

  // 6 怎么验收
  if (retestSec) {
    const p6 = secHead(6, "怎么验收", "s-retest", take(".lead", retestSec) && take(".lead", retestSec).textContent);
    const rc = take(".card", retestSec);
    for (const lb of rc.querySelectorAll(".rt-i .lb")) {
      lb.classList.add("trio");
      for (const sp of lb.children) {
        const t = sp.textContent, i = t.indexOf(" ");
        if (i < 0) continue;
        sp.textContent = "";
        sp.append(t.slice(0, i), el("b", null, t.slice(i + 1)));
      }
    }
    rc.querySelectorAll(".rt-i").forEach((it, i) => {
      const r = n.retest.items[i], t = r && doc.retest.find(x => x.check === r.check);
      const old = it.querySelector(":scope > svg");
      if (!t || !old) return;
      const target = t.target_max != null ? t.target_max : t.target_min;
      const pro = t.pro_p50 != null ? t.pro_p50 : t.pro_edge;
      const [lo, hi] = axis([t.now, target, pro]);
      const X = x => 14 + (x - lo) / (hi - lo) * 312;
      const g = svg("svg", { viewBox: "0 0 340 46", class: "goal" });
      g.append(svg("line", { x1: 4, x2: 336, y1: 18, y2: 18, stroke: "#26332C", "stroke-width": 1 }));
      const a = Math.min(X(target), X(pro)), b = Math.max(X(target), X(pro));
      g.append(svg("rect", { x: a, y: 13, width: Math.max(2, b - a), height: 10, rx: 5, fill: "#1F3A24" }));
      const dir = Math.sign(X(target) - X(t.now)) || 1;
      const x1 = X(t.now) + dir * 9, x2 = X(target) - dir * 10;
      g.append(svg("line", { x1, x2, y1: 18, y2: 18, stroke: "#F07A5E", "stroke-width": 1.5, "stroke-dasharray": "3 4", "stroke-linecap": "round" }));
      g.append(svg("path", { d: `M${x2 - dir * 6} 13.5L${x2} 18L${x2 - dir * 6} 22.5`, fill: "none", stroke: "#F07A5E", "stroke-width": 1.5, "stroke-linecap": "round", "stroke-linejoin": "round" }));
      g.append(svg("circle", { cx: X(pro), cy: 18, r: 5.5, fill: "#6FA8F0", stroke: "#131D18", "stroke-width": 1.5 }));
      g.append(svg("circle", { cx: X(target), cy: 18, r: 6.5, fill: "#9BE15D", stroke: "#131D18", "stroke-width": 1.5 }));
      g.append(svg("circle", { cx: X(t.now), cy: 18, r: 6.5, fill: "#F07A5E", stroke: "#131D18", "stroke-width": 1.5 }));
      for (const [x, word, cls] of []) {
        const tx = svg("text", { x, y: 42, "text-anchor": "middle", class: cls });
        tx.textContent = word;
        g.append(tx);
      }
      old.replaceWith(g);
    });
    p6.append(rc);
    parts.push(p6);
  }

  // 附录
  const p7 = el("section", "part");
  p7.id = "s-more";
  const card = el("div", "card more flat");
  const grip = photoSec ? [...photoSec.querySelectorAll(":scope > .card")].find(c => take("h3", c).textContent === "握杆") : null;
  card.append(fold("全部检查明细（按机位）", ...[...chkSec.querySelectorAll(":scope > .card")]));
  if (grip) card.append(fold("握杆照片", ...[...grip.children].slice(1)));
  card.append(fold("关于这份报告", footer));
  p7.append(card);
  parts.push(p7);

  const sign = el("div", "sign");
  const lu = el("div", "lock-up");
  lu.append(document.querySelector(".cn-mark").cloneNode(true), el("span", null, "caddie note"));
  sign.append(lu, el("p", null, "逐帧看动作，专业可对比"));
  parts.push(sign);
  main.append(...parts);

  // The section bar.
  const bar = document.querySelector(".secbar");
  const names = [["s-verdict", "结论"], ["s-basis", "依据"], ["s-now", "现状"], ["s-why", "原因"], ["s-fix", "怎么练"], ["s-retest", "验收"], ["s-more", "附录"]];
  bar.textContent = "";
  const links = {};
  for (const [id, name] of names) {
    if (!byIdEl(id)) continue;
    const a = el("a", null, name);
    a.href = "#" + id;
    links[id] = a;
    bar.append(a);
  }
  let current = null;
  const mark = () => {
    const y = innerHeight * 0.3;
    let at = Object.keys(links)[0];
    for (const id of Object.keys(links)) if (byIdEl(id).getBoundingClientRect().top <= y) at = id;
    if (at === current) return;
    current = at;
    Object.values(links).forEach(a => a.classList.remove("on"));
    links[at].classList.add("on");
    moveInd(links[at]);
  };
  const ind = el("span", "ind");
  bar.append(ind);
  const moveInd = a => { ind.style.left = a.offsetLeft + "px"; ind.style.width = a.offsetWidth + "px" };
  addEventListener("resize", () => current && moveInd(links[current]));
  const head = document.querySelector(".bar");
  addEventListener("scroll", () => { mark(); head.classList.toggle("scrolled", scrollY > 8) }, { passive: true });
  mark();

  // A link into a fold opens it first.
  const openTo = id => {
    const t = id && document.getElementById(id);
    if (!t) return;
    if (t.tagName === "DETAILS") t.open = true;
    for (let p = t.parentElement; p; p = p.parentElement) if (p.tagName === "DETAILS") p.open = true;
  };
  document.addEventListener("click", e => {
    const a = e.target.closest("a[href^='#']");
    if (a) openTo(a.getAttribute("href").slice(1));
  });
  openTo(location.hash.slice(1));
}

function fail(msg) {
  const main = document.getElementById("main");
  main.textContent = "";
  main.append(el("p", "empty", msg));
}

function start() {
  if (window.caddieReportDoc) return render(window.caddieReportDoc);
  fetch("report_doc.json").then(r => r.json()).then(render).catch(() => fail("没有找到报告数据。"));
}

if (window.caddieReportDoc) {
  start();
} else {
  const s = document.createElement("script");
  s.src = "report_doc.js";
  s.onload = start;
  s.onerror = start;
  document.head.append(s);
}
</script>
</body>
</html>
